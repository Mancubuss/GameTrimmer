[package]
name = "gametrimmer-core"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
crc32fast = "1.5.0"
# The 0.4.0 crates.io release pins binrw 0.11, which Rust 1.97 reports as
# future-incompatible. Upstream has merged the binrw 0.15 fix but has not cut
# a release yet; keep the exact reviewed commit reproducible through Cargo.lock.
ntfs = { git = "https://github.com/ColinFinck/ntfs", rev = "9359c7ab4f07f3ac1e43f3a1a464980e364555c4" }
rayon = "1.12.0"
regex = "1.13.0"
rusqlite = { version = "0.40.1", features = ["bundled", "hooks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
trash = "5.2.6"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_Ioctl", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Power"] }
winreg = "0.56.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
