[package]
name = "archive_trimmer"
version.workspace = true
edition.workspace = true
description = "Monolithic Game Archive Trimming and In-Place NTFS Sparse Zeroing Engine for GameTrimmer"

[lib]
name = "archive_trimmer"
path = "src/lib.rs"

[[bin]]
name = "archive-trimmer"
path = "src/main.rs"
required-features = ["gui", "cli"]

[features]
default = ["gui", "cli"]
gui = ["dep:eframe", "dep:rfd", "dep:rusqlite"]
cli = ["dep:clap"]

[dependencies]
byteorder = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
walkdir = "2.5.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

# Optional dependencies for standalone archive-trimmer tool
clap = { version = "4.5", features = ["derive"], optional = true }
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
], optional = true }
rfd = { version = "0.17.2", default-features = false, optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
