[package]
name = "gametrimmer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gametrimmer"
path = "src/main.rs"

[features]
# Enables the headless (CLI) mode as a whole - GT-10. Off by default, and off
# in the v1 release build: headless mode only ever reports what a scan found
# and, being a `windows_subsystem = "windows"` exe, hands the shell its prompt
# back before its own output arrives, so an operator was left pressing Enter
# at a finished-looking prompt. A read-only reporter that does not return the
# user to their console is not worth its surface area in a first release; it
# comes back once it works end to end. Build with `--features headless` to get
# it now.
#
# "Only ever reports" is not a temporary gap awaiting a future `--apply`: GT-89
# removed selection profiles from the whole product, so a fresh scan
# pre-selects nothing and only an explicit human tick ever selects a finding.
# Headless mode has no human to tick anything, so it has no way to choose
# files to delete - that is the permanent shape of the mode, not a defect.
# Unattended deletion returns under its own explicitly named policy (board
# card GT-EP24, "Авто-трим: unattended повторний трим після оновлення гри"),
# not as a headless `--apply`.
#
# A `const` rather than `#[cfg]` on the module (see `cli::args::HEADLESS_ENABLED`):
# the whole CLI stays compiled, type-checked and unit-tested in the default
# build, so it cannot rot while it is switched off.
headless = []

[build-dependencies]
winresource = "0.1.23"

[dependencies]
dunce = "1.0.5"
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
gametrimmer-core = { path = "../core" }
rayon = "1.12.0"
rfd = { version = "0.17.2", default-features = false }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Already a workspace dependency (`core`, `watch`) - reused here rather than
# hand-rolling `RegEnumKeyExW` to find where a launcher is installed.
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = "0.35.0"
tempfile = "3.27.0"
