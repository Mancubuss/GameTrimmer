[package]
name = "gametrimmer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gametrimmer"
path = "src/main.rs"

[features]
# Enables the headless (CLI) mode as a whole - GT-10. Off by default, and off
# in the v1 release build: the mode that shipped could not delete anything
# (`--apply` is gated separately, see below) and, being a `windows_subsystem =
# "windows"` exe, handed the shell its prompt back before its own output
# arrived, so an operator was left pressing Enter at a finished-looking prompt.
# A read-only reporter that does not return the user to their console is not
# worth its surface area in a first release; it comes back once it works end to
# end. Build with `--features headless` to get it now.
#
# A `const` rather than `#[cfg]` on the module (see `cli::args::HEADLESS_ENABLED`):
# the whole CLI stays compiled, type-checked and unit-tested in the default
# build, so it cannot rot while it is switched off.
headless = []

# Enables the CLI's `--apply` flag - the only path in the whole app where
# files are removed without a human click (GT-15). Off by default, and off in
# the v1 release build: that path has never been run live, and there is no way
# yet to point a scan at a single library (see the board card "GT-39 - scanning
# a chosen library or game"), so a live rehearsal would have to delete from a
# real game library. Verification is deferred until games can be restored
# automatically; build with `--features cli-apply` to re-enable it.
#
# Implies `headless`: a flag of a mode that is switched off has nothing to
# enable, and a build with `cli-apply` alone would advertise `--apply` in help
# text no invocation can reach.
cli-apply = ["headless"]

[build-dependencies]
winresource = "0.1.23"

[dependencies]
dunce = "1.0.5"
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
gametrimmer-core = { path = "../core" }
rayon = "1.12.0"
rfd = { version = "0.17.2", default-features = false }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = "0.35.0"
tempfile = "3.27.0"
