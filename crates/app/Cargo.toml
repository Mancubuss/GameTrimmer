[package]
name = "gametrimmer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gametrimmer"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.23"

[dependencies]
dunce = "1.0.5"
eframe = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
gametrimmer-core = { path = "../core" }
rayon = "1.12.0"
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
