[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# "unwind" (the Rust default) rather than "abort": `crates/app/src/worker/
# scan.rs:528` and `crates/core/src/mftscan/mod.rs:151` both rely on
# `catch_unwind` to isolate one provider's/volume's panic from the rest of a
# scan (a hardened defense against the `ntfs` crate panicking on
# unusual real-world volume layouts, see mftscan's module docs). With
# `panic = "abort"` those `catch_unwind` calls are silently dead code in
# release builds - any panic there kills the whole process instead of
# degrading that one game/volume to a walkdir fallback.
#
# Measured cost (2026-07-19, this exact tree, opt-level=z/lto=fat/
# codegen-units=1/strip=true unchanged in both builds): 10,913,792 bytes
# with "abort" vs. 13,189,120 bytes with "unwind" - about +2.18 MiB
# (+20.9%). That is real, not "a few hundred KiB" as originally guessed in
# docs/portability-audit.md finding #22 - flagged there as a deviation from
# the audit's own estimate. Kept as "unwind" anyway: this project's stated
# size sensitivity is about install/download footprint (portable zip on a
# flash drive), and a process-ending panic during a multi-hour scan (losing
# all progress) is a worse user-facing outcome than ~2 MiB. If size
# pressure becomes critical, the alternative is dropping the `catch_unwind`
# calls entirely and accepting whole-process-dies-on-panic - not silently
# keeping them as dead code under "abort".
panic = "unwind"
