[build]
# Non-ASCII (Cyrillic) characters in the project path break autocfg-based build
# scripts on Windows: autocfg spawns `rustc` with a probe file inside OUT_DIR,
# and OUT_DIR ends up unusable ("output path is not a writable directory") when
# it contains non-ASCII characters, because of Windows ANSI codepage argument
# conversion. Confirmed by building with CARGO_TARGET_DIR pointed outside the
# Cyrillic path segment, which fixed the failure.
#
# Fix: keep target-dir on an ASCII-only path, on the same drive, without
# moving/renaming the project itself.
target-dir = "E:/Mancubus/Projects/GameTrimmer-target"
