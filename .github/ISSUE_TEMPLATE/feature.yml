name: Feature request
description: Something the program should be able to do and cannot
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth reading first: the README's **"What GameTrimmer does NOT do"**
        section. Some of those are deliberate limits, not gaps — for instance
        the program will not go online, will not touch launcher state, and
        will not delete anything without a click.

  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: >
        The situation, not the solution. "I have 17 TB across two libraries and
        only wanted to trim one" says more than "add checkboxes to the library
        list".
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you work around it today
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: false
