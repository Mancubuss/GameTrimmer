name: CI

# Windows-only on purpose: the app links Win32 directly (elevation, MFT
# reader, Recycle Bin, registry providers), so a Linux job would not compile
# and a green Linux badge would say nothing about the only platform shipped.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  # Deliberately no `RUSTFLAGS: -D warnings`: it applies to dependencies too,
  # so a future-incompat warning in a transitive crate we do not own would
  # turn CI red for a reason no change here can fix. Warnings are denied where
  # they are ours - the clippy step below.

jobs:
  test:
    name: build, lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The whole suite, including the 15,000-row localization corpus in
      # crates/core/tests and the egui_kittest UI tests (no window, no GPU -
      # the snapshot/wgpu features are deliberately off, see ui::harness).
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Release build
        run: cargo build --workspace --all-features --release --locked

      - name: Install RustSec audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: RustSec audit
        run: cargo audit --deny warnings

  compatibility:
    name: Rust compatibility (${{ matrix.toolchain }})
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Compatibility check
        run: cargo +${{ matrix.toolchain }} check --workspace --all-targets --all-features --locked
