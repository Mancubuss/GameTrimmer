name: Release

# Builds the portable zip from a tag and publishes it as a draft release.
#
# Draft, not published: the release notes and the manual test run
# (docs/manual-test-plan.md) are a human's call. The workflow's job is to make
# sure the artifact attached to a tag was built from exactly that tag - not
# from whatever happened to be in a local dist/ folder, which is how a stale
# zip gets shipped (scripts/package-portable.ps1 fails silently when dist/ is
# locked).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for a dry run without pushing a tag)
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: build the portable zip
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The same suite CI runs. A tag that cannot pass its own tests must not
      # produce a downloadable exe.
      - name: Tests
        run: cargo test --workspace --locked

      - name: Package
        shell: pwsh
        run: pwsh -File scripts/package-portable.ps1

      # The version in the zip name comes from Cargo.toml; the tag comes from
      # git. If they disagree, the release would advertise a version the
      # binary does not report - fail loudly instead.
      - name: Check that the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tag) {
            throw "tag v$tag does not match Cargo.toml version $version"
          }
          "matched: $version"

      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          "$hash  $($zip.Name)" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
