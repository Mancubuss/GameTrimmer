name: Release

# Builds the portable zip from a tag and publishes it as a draft release.
#
# Draft, not published: the release notes and the manual test run
# (docs/manual-test-plan.md) are a human's call. The workflow's job is to make
# sure the artifact attached to a tag was built from exactly that tag - not
# from whatever happened to be in a local dist/ folder, which is how a stale
# zip gets shipped (scripts/package-portable.ps1 fails silently when dist/ is
# locked).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag, branch, or commit to build
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: build the portable zip
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Resolve source and verify a release tag
        id: source
        shell: pwsh
        run: |
          $requested = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.ref }}"
          } else {
            "${{ github.ref_name }}"
          }
          $sha = (git rev-parse HEAD).Trim()
          $tagCandidate = $requested -replace '^refs/tags/', ''
          $matchingTag = git tag --list --format='%(refname:short)' -- $tagCandidate |
            Where-Object { $_ -ceq $tagCandidate } |
            Select-Object -First 1
          $tagSha = if ($matchingTag) { (git rev-list -n 1 "refs/tags/$matchingTag").Trim() } else { "" }
          $isTag = [bool]$matchingTag -and $tagSha -eq $sha
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($isTag -and $version -ne ($tagCandidate -replace '^v', '')) {
            throw "tag $tagCandidate does not match Cargo.toml version $version"
          }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_tag=$($isTag.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tagCandidate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Resolved $requested to $sha (tag=$isTag)"

      # The same suite CI runs. A tag that cannot pass its own tests must not
      # produce a downloadable exe.
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Package
        shell: pwsh
        run: pwsh -File scripts/package-portable.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          "$hash  $($zip.Name)" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-zip
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Draft the GitHub release
        if: steps.source.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.source.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
